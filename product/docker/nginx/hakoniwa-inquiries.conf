# Install this location in the existing assets nginx server block.
# These files are public to anyone who knows the unguessable URL.
location ^~ /hakoniwa-inquiries/ {
    alias /srv/bot-assets/hakoniwa-inquiries/;
    autoindex off;
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
}
