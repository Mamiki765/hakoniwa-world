<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--BEGIN-->
<title>箱庭 TOPと島一覧 試作</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=DotGothic16&display=swap">
<link rel="stylesheet" href="../surface/style.css">
<link rel="stylesheet" href="top.css">
<!--HEAD-END-->
</head>
<body>
<div id="protobar">
    <strong class="proto-title">TOPと島一覧 試作</strong>
    <label class="proto-opt pc-only"><input type="checkbox" id="opt-phone"> スマホ幅で見る</label>
    <label class="proto-opt">状態
        <select id="opt-state">
            <option value="member">ログイン済み・島あり</option>
            <option value="guest">未ログイン</option>
            <option value="delayed">ターン更新が遅れている</option>
            <option value="empty">島がまだない</option>
        </select>
    </label>
    <label class="proto-opt">配色
        <select id="opt-theme"><option value="">端末に合わせる</option><option value="light">ライト</option><option value="dark">ダーク</option></select>
    </label>
    <span class="proto-note">固定データの試作です。島名・島主名・数値はすべて架空で、サーバーへは何も送りません。</span>
</div>
<div id="stage"><div id="top"></div></div>
<script src="top.js"></script>
<!--END-->
</body>
</html>
