# Install this location in the existing assets nginx server block.
# Every filename is replaced rather than overwritten, so visible profile images are immutable by URL.
location ^~ /hakoniwa-secretaries/ {
    alias /srv/bot-assets/hakoniwa-secretaries/;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}
